<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant Quote | Ohm's Cleaning Services</title>
  <!-- Meta Pixel -->
  <script>!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init', '1188332553042659');fbq('track', 'PageView');</script>
  <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1188332553042659&ev=PageView&noscript=1"/></noscript>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Marcellus', serif; background:#f0f4f8; padding:2rem; } .container { max-width:600px; margin:auto; background:#fff; border-radius:16px; padding:50px 35px; box-shadow:0 12px 24px rgba(0,0,0,0.08); text-align:center; } .logo { display:block; margin:0 auto 20px; max-width:200px; } h1 { margin-bottom:20px; } form { text-align:left; } label { font-weight:bold; display:block; margin-top:1rem; } input, select { width:100%; padding:0.7rem; border:1px solid #ccc; border-radius:6px; font-size:1rem; margin-top:0.3rem; } button { margin-top:1.5rem; padding:0.85rem; background:#091235; color:#fff; border:none; border-radius:8px; cursor:pointer; width:100%; } #quoteResult { margin-top:2rem; background:#e7f5ec; padding:1.5rem; border:2px solid #88A9C3; border-radius:12px; text-align:center; font-weight:bold; }</style>
</head>
<body>
  <div class="container">
    <img src="Main Branding.png" alt="Ohm's Cleaning Services Logo" class="logo" />
    <h1>Get Your Free Window Cleaning Quote</h1>
    <form id="quoteForm" onsubmit="return false;">
      <label for="stories">How many stories is your home?</label>
      <select id="stories" required><option value="">-- Select --</option><option value="1">1 Story</option><option value="2">2 Stories</option></select>
      <label for="windows">How many window panes? <br><small>(Each framed section of glass counts as one pane – a double-hung window usually has 2 panes.)</small></label>
      <input type="number" id="windows" min="1" required />
      <label for="interiorAdd">Would you like interior window cleaning?</label>
      <select id="interiorAdd" required><option value="no">No</option><option value="yes">Yes</option></select>
      <label for="solarScreens">Do you have solar screens?</label>
      <select id="solarScreens" required><option value="no">No</option><option value="yes">Yes</option></select>
      <label for="name">Your Name:</label>
      <input type="text" id="name" required />
      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" required />
      <label for="promo">Promo Code (optional):</label>
      <input type="text" id="promo" />
      <button type="submit">See My Estimated Quote</button>
    </form>
    <div id="quoteResult"></div>
  </div>
  <script>
    document.getElementById("quoteForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const stories = document.getElementById("stories").value;
      const panes = parseInt(document.getElementById("windows").value);
      const interiorAdd = document.getElementById("interiorAdd").value;
      const solarScreens = document.getElementById("solarScreens").value;
      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const promo = document.getElementById("promo").value.trim().toUpperCase();
      let basePrice = panes * 5.10;
      if (interiorAdd === "yes") { basePrice += panes * 2.0; }
      basePrice += 17;
      if (stories === "2") { basePrice += 60; }
      if (solarScreens === "yes") {
        basePrice += (stories === "2") ? 100 : 40;
      }
      basePrice = Math.ceil(basePrice / 5) * 5;
      let discount = 0;
      let finalPrice = basePrice;
      if (finalPrice < 149) { finalPrice = 149; }
      if (promo === "FB25") {
        discount = 25;
        finalPrice = finalPrice - discount;
        if (finalPrice < 0) { finalPrice = 0; }
      }
      const quoteMessage = `Name: ${name}\nPhone: ${phone}\nStories: ${stories}\nWindow Panes: ${panes}\nInterior: ${interiorAdd}\nSolar Screens: ${solarScreens}\nPromo: ${promo || 'None'}\nQuote: $${finalPrice.toFixed(2)}`;
      fetch("https://formspree.io/f/xgvkknzp", {method: "POST", headers: {'Accept': 'application/json','Content-Type': 'application/json'}, body: JSON.stringify({ name, phone, message: quoteMessage })})
      .then(res => res.json())
      .then(data => {
        fbq('track', 'Lead');
        let msg = `<strong>Thanks, ${name}!</strong><br>`;
        msg += `Your quote is <span>$${finalPrice.toFixed(2)}</span>.`;
        msg += `<br><em>Redirecting to schedule...</em>`;
        document.getElementById("quoteResult").innerHTML = msg;
        setTimeout(() => { window.location.href = "https://calendly.com/ohmscleaningservice"; }, 8500);
      })
      .catch(() => alert("Error sending info. Please contact us."));
    });
  </script>
</body>
</html>
