<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Quote | Ohm's Cleaning Services</title>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Marcellus', serif;
      background-color: #f0f4f8;
      color: #14202E;
      line-height: 1.6;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background-color: #ffffff;
      border-radius: 16px;
      padding: 50px 35px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.08);
    }
    .logo {
      display: block;
      margin: 0 auto 25px;
      max-width: 160px;
    }
    h1 {
      text-align: center;
      color: #061738;
      font-size: 2.2rem;
      margin-bottom: 25px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }
    label {
      font-weight: bold;
      color: #091235;
    }
    input, select {
      padding: 0.7rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      padding: 0.85rem;
      background-color: #091235;
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #1d2a49;
    }
    #quoteResult {
      margin-top: 2.2rem;
      padding: 1.5rem;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      background-color: #e7f5ec;
      border: 2px solid #88A9C3;
      border-radius: 12px;
      color: #0b3d2e;
    }
    .back-home {
      display: block;
      text-align: center;
      margin-top: 2rem;
      text-decoration: none;
      color: #091235;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="Main Branding.png" alt="Ohm's Cleaning Services" class="logo">
    <h1>Get Your Free Window Cleaning Quote</h1>

    <form id="quoteForm">
      <label for="stories">How many stories is your home?</label>
      <select id="stories" required>
        <option value="">-- Select --</option>
        <option value="1">1 Story</option>
        <option value="2">2 Stories</option>
      </select>

      <label for="windows">How many window panes?</label>
      <input type="number" id="windows" min="1" required>

      <label for="screenClean">Would you like screen cleaning?</label>
      <select id="screenClean" required>
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>

      <label for="interiorAdd">Would you like interior window cleaning?</label>
      <select id="interiorAdd" required>
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>

      <label for="name">Your Name:</label>
      <input type="text" id="name" required>

      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" required>

      <label for="promo">Promo Code (optional):</label>
      <input type="text" id="promo" >

      <button type="submit">See My Estimated Quote</button>
    </form>

    <div id="quoteResult"></div>
    <a class="back-home" href="index.html">← Back to Homepage</a>
  </div>

  <script>
    document.getElementById("quoteForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const stories = document.getElementById("stories").value;
      const panes = parseInt(document.getElementById("windows").value);
      const screenAdd = document.getElementById("screenClean").value;
      const interiorAdd = document.getElementById("interiorAdd").value;
      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const promo = document.getElementById("promo").value.trim().toUpperCase();

      let price = panes * 5.35;

      if (interiorAdd === "yes") {
        price += panes * 2.5;
      }

      if (screenAdd === "yes") {
        price += 25;
      }

      if (stories === "2") {
        price += 60;
      }

      let discount = 0;
      let originalPrice = price;
      if (promo === "FB25") {
        discount = 25;
        price = Math.max(0, price - discount);
      }

      const quoteMessage = `Name: ${name}\nPhone: ${phone}\nStories: ${stories}\nWindow Panes: ${panes}\nScreen Cleaning: ${screenAdd}\nInterior Add-on: ${interiorAdd}\nPromo Code: ${promo || 'None'}\nEstimated Quote: $${price.toFixed(2)}`;

      fetch("https://formspree.io/f/xgvkknzp", {
        method: "POST",
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          name,
          phone,
          message: quoteMessage
        })
      })
      .then(response => response.json())
      .then(data => {
        console.log("Formspree response:", data);
        let resultText = `<strong>Thanks, ${name}!</strong><br>`;
        if (discount > 0) {
          resultText += `Original Price: <s>$${originalPrice.toFixed(2)}</s><br>`;
          resultText += `<span style='color:#0b3d2e;'>Discounted Price: $${price.toFixed(2)}</span><br>`;
          resultText += `<span style='color:#c14c4c;'>Promo "FB25" applied – you saved $${discount.toFixed(2)}!</span>`;
        } else {
          resultText += `Your estimated window cleaning is <span style='color:#0b3d2e;'>$${price.toFixed(2)}</span>.`;
        }
        resultText += `<br><em>Redirecting you to schedule now...</em>`;
        document.getElementById("quoteResult").innerHTML = resultText;

        setTimeout(() => {
          window.location.href = "https://calendly.com/ohmscleaningservice";
        }, 5000);
      })
      .catch(error => {
        console.error("Formspree error:", error);
        alert("There was an error sending your information. Please contact us directly.");
      });
    });
  </script>
</body>
</html>
