<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Quote Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f9fbfc;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      padding: 12px 24px;
      background-color: #091235;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #result {
      margin-top: 30px;
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Get Your Instant Quote</h1>
  <div class="form-group">
    <label for="story">Number of Stories</label>
    <select id="story">
      <option value="1">1 Story</option>
      <option value="2">2 Stories</option>
    </select>
  </div>
  <div class="form-group">
    <label for="windows">Number of Windows</label>
    <input type="number" id="windows" min="1">
  </div>
  <div class="form-group">
    <label for="interior">Add Interior Window Cleaning?</label>
    <select id="interior">
      <option value="no">No</option>
      <option value="yes">Yes</option>
    </select>
  </div>
  <div class="form-group">
    <label for="screens">Add Screen Cleaning?</label>
    <select id="screens">
      <option value="no">No</option>
      <option value="yes">Yes</option>
    </select>
  </div>
  <div class="form-group">
    <label for="promo">Promo Code (optional)</label>
    <input type="text" id="promo">
  </div>
  <button onclick="calculateQuote()">Calculate Quote</button>
  <div id="result"></div>

  <script>
    function calculateQuote() {
      const story = parseInt(document.getElementById('story').value);
      const windows = parseInt(document.getElementById('windows').value);
      const interior = document.getElementById('interior').value;
      const screens = document.getElementById('screens').value;
      const promoCode = document.getElementById('promo').value.trim().toUpperCase();

      let basePrice = 0;
      if (story === 1) {
        if (windows >= 10 && windows <= 20) basePrice = 179;
        else if (windows >= 21 && windows <= 25) basePrice = 199;
        else if (windows >= 26 && windows <= 35) basePrice = 249;
        else basePrice = 0;
      } else if (story === 2) {
        if (windows >= 15 && windows <= 20) basePrice = 209;
        else if (windows >= 21 && windows <= 25) basePrice = 249;
        else if (windows >= 26 && windows <= 35) basePrice = 299;
        else basePrice = 0;
      }

      if (basePrice === 0) {
        document.getElementById('result').innerText = 'Please contact us for a custom quote.';
        return;
      }

      let interiorAdd = 0;
      if (interior === 'yes') {
        if (windows >= 15 && windows <= 20) interiorAdd = 129;
        else if (windows >= 21 && windows <= 25) interiorAdd = 149;
        else if (windows >= 26 && windows <= 35) interiorAdd = 179;
      }

      let screenAdd = screens === 'yes' ? 25 : 0;

      let total = basePrice + interiorAdd + screenAdd;

      if (promoCode === 'FB25') {
        total -= 25;
      }

      document.getElementById('result').innerText = `Your estimated quote is $${total}.`;
    }
  </script>
</body>
</html>
